name: Deploy Documentation (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - 'docs/**'
      - 'assets/**'
      - 'scripts/build_docs.py'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP & Composer for Carbon frontend assets
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer Carbon & IBM Plex assets
        run: composer install --no-interaction --no-progress --no-dev

      - name: Build Carbon-styled documentation site
        run: python scripts/build_docs.py --output _site --base-url "/${{ github.event.repository.name }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
