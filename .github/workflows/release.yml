name: Build and Release Windows Binary
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install frontend Carbon dependencies (Composer)
      run: |
        composer install --no-interaction --no-progress

    - name: Compile translation catalogs
      run: |
        python -m babel.messages.frontend compile -d locales -D aethernms

    - name: Run test suite
      run: |
        python -m pytest tests/ -v

    - name: Inject Version & Repository Metadata
      run: |
        $tag = "${{ github.ref_name }}".Trim()
        if ($tag -match '^\d') { $tag = "v$tag" }
        $shortSha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0, [Math]::Min(7, $env:GITHUB_SHA.Length)) } else { "" }
        $releaseVer = if ($tag -and $tag -ne "DEV_BUILD") { if ($shortSha) { "$tag-$shortSha" } else { $tag } } elseif ($shortSha) { $shortSha } else { "DEV_BUILD" }
        (Get-Content aethernms/__init__.py) -replace '__version__ = "DEV_BUILD"', "__version__ = `"$releaseVer`"" -replace '__repo_url__ = ".*"', "__repo_url__ = `"https://github.com/${{ github.repository }}`"" | Set-Content aethernms/__init__.py

    - name: Build executable
      run: |
        pyinstaller --onedir --icon assets/aethernms.ico --name aethernms-x64 --collect-all py4web --collect-all pydal --collect-all yatl --collect-all ombott --collect-all renoir --collect-all rocket3 --collect-all netmiko --add-data "aethernms/templates;aethernms/templates" --add-data "aethernms/static;aethernms/static" --add-data "snippets;snippets" --add-data "locales;locales" --add-data "assets;assets" --hidden-import airwaveapiclient main.py

    - name: Prepare Release Package
      run: |
        mkdir release_package
        Move-Item -Path dist\aethernms-x64 -Destination release_package\
        Copy-Item -Path LICENSE, README.md, CHANGELOG.md -Destination release_package\aethernms-x64\
        Copy-Item -Path wiki -Destination release_package\aethernms-x64\ -Recurse
        Compress-Archive -Path release_package\aethernms-x64\* -DestinationPath aethernms-win-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: aethernms-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
