<!-- AirWave Import Modal -->
<div id="modal-airwave" class="cds--modal cds--modal-backdrop" role="dialog" aria-modal="true">
  <div class="cds--modal-container xl">
    <div class="cds--modal-header">
      <h3 class="cds--modal-header__heading" data-i18n="Import from AirWave">[[=T("Import from AirWave")]]</h3>
      <button type="button" class="cds--modal-close" data-modal-cancel aria-label="[[=T('Close')]]">
        [[=XML(icon("close", 20))]]
      </button>
    </div>
    <div class="cds--modal-content">
      <div id="aw-err" class="cds--inline-notification cds--inline-notification--error hidden"></div>
      <div class="filter-bar">
        <div class="filter-field">
          <label class="cds--label" for="aw-url" data-i18n="AirWave URL / IP *">[[=T("AirWave URL / IP *")]]</label>
          <input id="aw-url" class="cds--text-input" type="text" />
        </div>
        <div class="filter-field compact">
          <label class="cds--label" for="aw-user" data-i18n="Username *">[[=T("Username *")]]</label>
          <input id="aw-user" class="cds--text-input" type="text" />
        </div>
        <div class="filter-field compact">
          <label class="cds--label" for="aw-pass" data-i18n="Password *">[[=T("Password *")]]</label>
          <input id="aw-pass" class="cds--text-input" type="password" autocomplete="new-password" />
        </div>
        <label class="checkbox-label" style="padding-bottom:6px;"><input id="aw-ssl" type="checkbox" /> <span data-i18n="Verify SSL">[[=T("Verify SSL")]]</span></label>
        <button type="button" class="cds--btn cds--btn--primary cds--btn--sm" id="btn-aw-fetch">
          [[=XML(icon("cloud-download", 16))]]
          <span data-i18n="Fetch Inventory">[[=T("Fetch Inventory")]]</span>
        </button>
      </div>

      <div class="anms-table-container">
        <div class="anms-dt-toolbar">
          <div class="anms-dt-search-wrap">
            <span class="anms-dt-search-icon">[[=XML(icon("search", 16))]]</span>
            <input
              id="aw-dt-search"
              class="anms-dt-search-input"
              type="text"
              placeholder="[[=T('Search table...')]]"
              data-i18n-placeholder="Search table..."
              aria-label="[[=T('Search table...')]]"
            />
            <button type="button" id="aw-dt-search-clear" class="anms-dt-search-clear hidden" title="[[=T('Clear')]]" data-i18n-title="Clear">
              [[=XML(icon("close", 16))]]
            </button>
          </div>
          <div class="anms-dt-toolbar-actions">
            <div class="anms-dt-filter-wrap">
              <button type="button" id="aw-filter-btn" class="anms-dt-icon-btn" title="[[=T('Filter')]]" data-i18n-title="Filter" aria-label="[[=T('Filter')]]">
                [[=XML(icon("filter", 16))]]
                <span id="aw-filter-badge" class="anms-filter-badge hidden">0</span>
              </button>
              <div id="aw-filter-popover" class="anms-filter-popover hidden" role="dialog" aria-label="[[=T('Filters')]]">
                <div class="anms-filter-popover__body">
                  <div class="cds--form-item">
                    <label class="cds--label" for="aw-flt-folder" data-i18n="Group">[[=T("Group")]]</label>
                    <select id="aw-flt-folder" class="cds--select-input"></select>
                  </div>
                  <div class="cds--form-item">
                    <label class="cds--label" for="aw-flt-os" data-i18n="Netmiko Platform">[[=T("Netmiko Platform")]]</label>
                    <select id="aw-flt-os" class="cds--select-input"></select>
                  </div>
                </div>
                <div class="anms-filter-popover__footer">
                  <button type="button" id="aw-filter-reset" class="cds--btn cds--btn--secondary" data-i18n="Reset filters">[[=T("Reset filters")]]</button>
                  <button type="button" id="aw-filter-apply" class="cds--btn cds--btn--primary" data-i18n="Apply">[[=T("Apply")]]</button>
                </div>
              </div>
            </div>
            <button type="button" class="cds--btn cds--btn--ghost" id="btn-aw-select-all" data-i18n="Select All">[[=T("Select All")]]</button>
          </div>
        </div>
        <div id="aw-active-filters" class="anms-active-filters hidden"></div>

        <div class="table-wrap">
          <table class="cds--data-table">
            <thead>
              <tr>
                <th class="col-check"></th>
                <th data-i18n="Device">[[=T("Device")]]</th>
                <th data-i18n="Status">[[=T("Status")]]</th>
                <th data-i18n="IP Address">[[=T("IP Address")]]</th>
                <th data-i18n="Model">[[=T("Model")]]</th>
                <th data-i18n="OS Type">[[=T("OS Type")]]</th>
                <th data-i18n="Netmiko Platform">[[=T("Netmiko Platform")]]</th>
                <th data-i18n="Protocol">[[=T("Protocol")]]</th>
                <th data-i18n="Group">[[=T("Group")]]</th>
              </tr>
            </thead>
            <tbody id="aw-tbody"></tbody>
          </table>
        </div>
        <div id="aw-pagination" class="cds--pagination"></div>
      </div>
    </div>
    <div class="cds--modal-footer spread">
      <span id="aw-status-text" class="cds--helper-text" data-i18n="Enter AirWave credentials and click Fetch Inventory.">[[=T("Enter AirWave credentials and click Fetch Inventory.")]]</span>
      <div style="display:flex;gap:8px;">
        <button type="button" class="cds--btn cds--btn--secondary" data-modal-cancel data-i18n="Cancel">[[=T("Cancel")]]</button>
        <button type="button" class="cds--btn cds--btn--primary" id="btn-aw-import" data-i18n="Import Selected">[[=T("Import Selected")]]</button>
      </div>
    </div>
  </div>
</div>
