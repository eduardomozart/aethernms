<!-- About Modal -->
<div id="modal-about" class="cds--modal cds--modal-backdrop" role="dialog" aria-modal="true">
  <div class="cds--modal-container" style="max-width:440px;">
    <div class="cds--modal-header">
      <h3 id="about-title" class="cds--modal-header__heading" data-i18n="About">About</h3>
      <button type="button" class="cds--modal-close" data-modal-cancel aria-label="Close">
        [[=XML(icon("close", 20))]]
      </button>
    </div>
    <div class="cds--modal-content" style="text-align:center;">
      <img src="/assets/aethernms-about.png" alt="aethernms" style="width:72px;height:72px;margin-bottom:10px;" />
      <h3 style="margin:0 0 4px;">aethernms</h3>
      <p id="about-version" class="cds--helper-text" style="margin:0 0 12px;"></p>
      <div class="cds--helper-text" data-i18n="Repository:">Repository:</div>
      <a id="about-repo" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="cds--modal-footer">
      <button type="button" class="cds--btn cds--btn--primary" data-modal-cancel data-i18n="Close">Close</button>
    </div>
  </div>
</div>
