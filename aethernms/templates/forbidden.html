<!DOCTYPE html>
<html lang="[[=html_lang]]" class="cds--[[=initial_theme]]" data-carbon-theme="[[=initial_theme]]" data-theme-mode="[[=theme_mode]]" data-page-title="Access Denied">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[[=page_title]] - aether</title>
  [[include 'partials/head_icons.html']]
  <link rel="stylesheet" href="/static/vendor/npm-asset/carbon--styles/css/styles.min.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/400.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/600.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-mono/400.css" />
  <link rel="stylesheet" href="/static/css/aethernms-carbon.css" />
  <script>
    (function () {
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.className = dark ? "cds--g100" : "cds--white";
      document.documentElement.setAttribute("data-carbon-theme", dark ? "g100" : "white");
    })();
  </script>
</head>
<body>
  <div class="login-shell">
    [[include 'partials/header.html']]
    <main class="login-main">
      <section class="login-card" style="max-width:520px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;color:#da1e28;">
          [[=XML(icon("locked", 28))]]
          <h1 class="tile-title" style="font-size:22px;">403 — [[=T("Access Denied")]]</h1>
        </div>
        <p style="margin:0 0 20px;line-height:1.5;color:var(--cds-text-secondary);">[[=message]]</p>
        <div style="display:flex;gap:8px;">
          <a href="/" class="cds--btn cds--btn--primary">[[=T("Return to Application")]]</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
