<!DOCTYPE html>
<html lang="[[=html_lang]]" class="cds--[[=initial_theme]]" data-carbon-theme="[[=initial_theme]]" data-theme-mode="[[=theme_mode]]" data-needs-setup="[[='true' if needs_setup else 'false']]" data-page-title="Sign In">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[[=page_title]] - aether</title>
  [[include 'partials/head_icons.html']]
  <link rel="stylesheet" href="/static/vendor/npm-asset/carbon--styles/css/styles.min.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/300.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/400.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/500.css" />
  <link rel="stylesheet" href="/static/vendor/npm-asset/fontsource--ibm-plex-sans/600.css" />
  <link rel="stylesheet" href="/static/css/aethernms-carbon.css" />
  <script>
    (function () {
      var el = document.documentElement;
      if (el.getAttribute("data-theme-mode") === "auto" && window.matchMedia) {
        var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = isDark ? "g100" : "white";
        el.setAttribute("data-carbon-theme", theme);
        el.className = "cds--" + theme;
      }
    })();
  </script>
</head>
<body>
  <div class="login-shell">
    [[include 'partials/header.html']]

    <main class="login-main">
      <section id="login-card" class="login-card">
        <div class="login-brand">
          <div class="anms-brand-lockup" aria-label="ÆTHER NMS">
            <span class="anms-brand-wordmark anms-brand-wordmark--lg">ÆTHER</span>
            <span class="anms-brand-sub anms-brand-sub--lg">NMS</span>
          </div>
          <div>
            <h1 id="auth-heading" class="tile-title" style="font-size:22px;font-weight:400;" data-i18n="Sign In">[[=T("Sign In")]]</h1>
          </div>
        </div>

        <div id="auth-error" class="cds--inline-notification cds--inline-notification--error hidden" role="alert">
          <span id="auth-error-msg"></span>
        </div>

        <form id="auth-form" style="display:flex;flex-direction:column;gap:14px;">
          <div class="cds--form-item">
            <label class="cds--label" for="auth-username" data-i18n="Username *">[[=T("Username *")]]</label>
            <input id="auth-username" class="cds--text-input" type="text" autocomplete="username" required autofocus />
          </div>
          <div class="cds--form-item">
            <label class="cds--label" for="auth-password" data-i18n="Password *">[[=T("Password *")]]</label>
            <input id="auth-password" class="cds--text-input" type="password" autocomplete="current-password" required />
          </div>
          <div id="confirm-wrap" class="cds--form-item hidden">
            <label class="cds--label" for="auth-confirm" data-i18n="Confirm Password *">[[=T("Confirm Password *")]]</label>
            <input id="auth-confirm" class="cds--text-input" type="password" autocomplete="new-password" />
          </div>
          <button id="auth-submit" class="cds--btn cds--btn--primary login-submit-btn" type="submit" data-i18n="Sign In">
            [[=T("Sign In")]]
          </button>
        </form>
      </section>
    </main>
  </div>

  <script id="anms-initial-i18n" type="application/json">[[=XML(initial_i18n_json)]]</script>
  <script>
    (async function () {
      const rootEl = document.documentElement;
      let catalog = {};
      let effLang = "";
      try {
        const initEl = document.getElementById("anms-initial-i18n");
        if (initEl && initEl.textContent) {
          const initData = JSON.parse(initEl.textContent);
          catalog = initData.catalog || {};
          effLang = initData.effective_language || "";
        }
      } catch (_e) {}

      const t = (key) => catalog[key] || key;

      function getPreferredBrowserLang() {
        const params = new URLSearchParams(window.location.search);
        const queryLang = (params.get("lang") || "").trim();
        if (queryLang) return queryLang;
        if (Array.isArray(navigator.languages) && navigator.languages.length) {
          return navigator.languages.join(",");
        }
        return (navigator.language || navigator.userLanguage || "").trim();
      }

      const preferredLang = getPreferredBrowserLang();
      const firstToken = (preferredLang.split(",")[0] || "").trim().replaceAll("-", "_").toLowerCase();
      const effNorm = effLang.toLowerCase();
      if (preferredLang && (!effNorm || (firstToken && !firstToken.startsWith(effNorm.split("_")[0])))) {
        try {
          const i18nRes = await fetch("/i18n?lang=" + encodeURIComponent(preferredLang));
          if (i18nRes.ok) {
            const i18nData = await i18nRes.json();
            catalog = i18nData.catalog || {};
            if (i18nData.effective_language) {
              rootEl.setAttribute("lang", i18nData.effective_language.replaceAll("_", "-"));
            }
            document.querySelectorAll("[data-i18n]").forEach((el) => {
              el.textContent = t(el.getAttribute("data-i18n"));
            });
            document.querySelectorAll("[data-i18n-title]").forEach((el) => {
              el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
            });
          }
        } catch (_e) {}
      }

      const needsSetup = rootEl.getAttribute("data-needs-setup") === "true";
      const heading = document.getElementById("auth-heading");
      const confirmWrap = document.getElementById("confirm-wrap");
      const confirmInput = document.getElementById("auth-confirm");
      const submitBtn = document.getElementById("auth-submit");
      const errBox = document.getElementById("auth-error");
      const errMsg = document.getElementById("auth-error-msg");

      function safeNextPath() {
        const params = new URLSearchParams(window.location.search);
        const nxt = (params.get("next") || "").trim();
        return nxt.startsWith("/") && !nxt.startsWith("//") ? nxt : "/";
      }

      if (needsSetup) {
        heading.textContent = t("Initial Administrator Setup");
        submitBtn.textContent = t("Create Administrator");
        confirmWrap.classList.remove("hidden");
        confirmInput.required = true;
      } else {
        heading.textContent = t("Sign In");
        submitBtn.textContent = t("Sign In");
      }
      document.title = `${heading.textContent} - aether`;
      document.getElementById("auth-username").focus();

      document.getElementById("auth-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        errBox.classList.add("hidden");
        const username = document.getElementById("auth-username").value.trim();
        const password = document.getElementById("auth-password").value;
        if (needsSetup && password !== confirmInput.value) {
          errMsg.textContent = t("Passwords do not match.");
          errBox.classList.remove("hidden");
          return;
        }
        submitBtn.disabled = true;
        try {
          const endpoint = needsSetup ? "/setup" : "/login";
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            errMsg.textContent = t(data.error || "Invalid username or password.");
            errBox.classList.remove("hidden");
            return;
          }
          window.location.href = safeNextPath();
        } catch (err) {
          errMsg.textContent = String(err);
          errBox.classList.remove("hidden");
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
